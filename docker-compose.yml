x-defaults: &defaults
  OBSERVABILITY_ENABLED: "false"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
  DB_URL: postgres://rails_react_monolith:password@db:5432/rails_react_monolith_development
  REDIS_URL: redis://redis:6379/0
  RAILS_ENV: development

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rails_react_monolith
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rails_react_monolith_development
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rails_react_monolith -d rails_react_monolith_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: bash -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle-data:/usr/local/bundle
      - node-modules-data:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      <<: *defaults
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    build: .
    command: bash -c "bundle exec sidekiq -C config/sidekiq.yml & wait"
    volumes:
      - .:/app
      - bundle-data:/usr/local/bundle
    ports:
      - "9292:9292"
    environment:
      <<: *defaults
      OTEL_SERVICE_NAME: rails-react-monolith-sidekiq
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # e2e tests using playwright only run on request via:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /app
    volumes:
      - .:/app
      - e2e-node-modules-data:/app/node_modules
    environment:
      BASE_URL: http://web:3000
    command: bash -c "npm ci && npm run test:e2e"
    depends_on:
      - web

  # K6 Test suite only runs on request, same as `e2e` above:
  #   docker compose --profile load run --rm k6 run /scripts/(breakpoint|load|smoke|soak|spike|stress)_test.js
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes:
      - ./k6:/scripts
    environment:
      BASE_URL: http://web:3000
    command: run /scripts/load_test.js
    depends_on:
      - web

  # Observability suite only runs on request, ensure OBSERVABILITY_ENABLED set to "true" in `x-defaults` above:
  #   docker compose --profile observability up -d
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceToProfiles tracesEmbeddedFlameGraph"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-pyroscope-app
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - pyroscope

  pyroscope:
    image: grafana/pyroscope:latest
    profiles: ["observability"]
    ports:
      - "4040:4040"

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yml"]
    profiles: ["observability"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml
    ports:
      - "3200:3200" # Tempo query API
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:latest
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345" # Alloy's UI/debug endpoint
      - "12347:12347" # Faro receiver
    depends_on:
      - tempo
      - loki

  # Scrape custom metrics from rails/sidekiq
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - web
      - sidekiq

volumes:
  db-data:
  bundle-data:
  node-modules-data:
  e2e-node-modules-data: