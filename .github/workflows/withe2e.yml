on:
  push:
    branches: [service-user]
  workflow_dispatch:
    inputs:
      zap_max_minutes:
        description: 'ZAP time limit in minutes, applied to each scan phase (spider and active scan) of both scans (empty = no limit)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: rails-with-react-e2e-testing
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: 00rawrus00/rails-with-react
  IMAGE_TAG: latest

name: test workflow

jobs:
  rails_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      
      - name: Run rubocop
        env:
          # config/database.yml requires DB_URL to boot Rails; rubocop never connects
          DB_URL: postgres://unused:unused@localhost:5432/unused
        run: bundle exec rake rubocop:markdown

  rails_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rails_react_monolith
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_react_monolith_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1

      - name: Run rspec unit tests
        env:
          DB_URL: postgres://rails_react_monolith:password@localhost:5432/rails_react_monolith_development
        run: bundle exec rake coverage:report
      
      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rails-coverage.html
          path: coverage/index.html
          overwrite: true

  frontend_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Ensure packages installed
        run: npm ci

      - name: Run linter
        run: |
          status=0
          npx biome check --error-on-warnings --reporter=github --reporter=json --reporter-file=biome-report.json || status=$?
          node scripts/biome-summary.mjs biome-report.json >> "$GITHUB_STEP_SUMMARY"
          exit $status

  frontend_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Ensure packages installed
        run: npm ci

      - name: Run vitest
        run: |
          npx vitest run --coverage
          cat vitest-report.md  >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        id: upload-report
        with:
          name: vitest-results.html
          path: vitest-results/index.html
          overwrite: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage.json
          path: coverage/coverage-final.json
          overwrite: true

      - name: Link HTML report
        run: echo "::notice title=Vitest HTML report::$REPORT_URL"
        env:
          REPORT_URL: https://viewer.vitest.dev/?url=${{ steps.upload-report.outputs.artifact-url }}

  docker_build:
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }} 

      - name: Build image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: 00rawrus00/rails-with-react:latest
          attests: type=sbom,generator=docker/buildkit-syft-scanner:stable-1
          cache-from: type=gha
          cache-to: type=gha,mode=max
    
  docker_scan:
    runs-on: ubuntu-latest
    needs: [docker_build]

    # Job-level permissions replace the workflow-level ones, so repeat what the attest step needs
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}      

      - name: Generate SBOM and CVE report with Docker scout
        uses: docker/scout-action@v1
        with:
          command: sbom
          format: cyclonedx
          image: 00rawrus00/rails-with-react:latest
          output: rails-with-react-sbom.json
          only-severities: critical,high
      
      - name: Generate CVE report
        uses: docker/scout-action@v1
        with:
          command: cves
          image: 00rawrus00/rails-with-react:latest
          only-severities: critical,high
          output: rails-with-react-cves.json
          sarif-file: rails-with-react-cves.sarif
          only-fixed: true
          write-comment: true

      - name: Upload CVE results to code scanning
        if: ${{ !cancelled() && hashFiles('rails-with-react-cves.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rails-with-react-cves.sarif
          category: docker-scout

      - name: Check sbom size
        run: du -sh rails-with-react-sbom.json

      # Max attestation size 16Mb
      - name: Publish attestation
        uses: actions/attest@v4
        with:
          subject-name: 00rawrus00/rails-with-react
          subject-digest: ${{ needs.docker_build.outputs.digest }}
          sbom-path: rails-with-react-sbom.json
          show-summary: true
        continue-on-error: true

  e2e_test:
    needs: docker_build
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rails_react_monolith
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_react_monolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rails_react_monolith -d rails_react_monolith_test" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      web:
        image: 00rawrus00/rails-with-react:latest
        env:
          DB_URL: postgres://rails_react_monolith:password@postgres:5432/rails_react_monolith_test
          REDIS_URL: redis://redis:6379/0
          RAILS_ENV: test
        ports:
          - 3000:3000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Ensure packages installed
        run: npm ci

      - name: Install playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        env:
          BASE_URL: http://web:3000
        run: |
          npm run test:e2e
          cat playwright-report.md >> $GITHUB_STEP_SUMMARY

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run test:e2e:report

      - name: Archive Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          overwrite: true

  zap_scan:
    needs: docker_build
    runs-on: ubuntu-latest

    env:
      # Empty means no limit. Set via the workflow_dispatch input, or a repository variable for push runs.
      ZAP_MAX_MINUTES: ${{ inputs.zap_max_minutes || vars.ZAP_MAX_MINUTES }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rails_react_monolith
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_react_monolith_test
        options: >-
          --health-cmd "pg_isready -U rails_react_monolith -d rails_react_monolith_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      web:
        image: 00rawrus00/rails-with-react:latest
        env:
          DB_URL: postgres://rails_react_monolith:password@postgres:5432/rails_react_monolith_test
          REDIS_URL: redis://redis:6379/0
          RAILS_ENV: test
        ports:
          - 3000:3000

    steps:
      # The API scan reads doc/openapi.yaml from the workspace
      - name: Checkout repo
        uses: actions/checkout@v7

      # Any HTTP response counts as up (the app may redirect to login), only connection failures are retried.
      - name: Wait for web service
        run: >-
          curl --silent --show-error --output /dev/null
          --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors
          http://localhost:3000/

      # Sign up through the JSON endpoint (RAILS_ENV=test has CSRF protection off) and give ZAP the session cookie.
      # The action forwards ZAP_AUTH_HEADER and ZAP_AUTH_HEADER_VALUE into the ZAP container.
      - name: Create ZAP test user
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          email="zap-$(date +%s)@example.test"
          status=$(jq -n --arg email "$email" --arg password "$password" \
            '{email_address: $email, password: $password, password_confirmation: $password}' |
            curl --silent --show-error --request POST http://localhost:3000/registrations \
              --header 'Content-Type: application/json' --data @- \
              --dump-header "$RUNNER_TEMP/zap-headers.txt" --output "$RUNNER_TEMP/zap-body.json" \
              --write-out '%{http_code}')
          if [ "$status" != "201" ]; then
            echo "::error::Signup returned HTTP $status"
            cat "$RUNNER_TEMP/zap-body.json"
            exit 1
          fi
          cookie=$(tr -d '\r' < "$RUNNER_TEMP/zap-headers.txt" |
            sed -nE 's/^[Ss]et-[Cc]ookie: (session_id=[^;]+).*/\1/p' | head -n 1)
          if [ -z "$cookie" ]; then
            echo "::error::Signup response had no session_id cookie"
            exit 1
          fi
          echo "::add-mask::$cookie"
          echo "::add-mask::${cookie#session_id=}"
          {
            echo "ZAP_AUTH_HEADER=Cookie"
            echo "ZAP_AUTH_HEADER_VALUE=$cookie"
          } >> "$GITHUB_ENV"

      # DELETE /session destroys the test user's session row, which would log ZAP out mid-scan, so keep it
      # out of the scan. Several -config options share one -z argument.
      - name: Configure ZAP options
        id: zap_options
        run: |
          spider_options=""
          zap_config='-config globalexcludeurl.url_list.url(0).regex=.*/session$ -config globalexcludeurl.url_list.url(0).enabled=true'
          if [ -n "$ZAP_MAX_MINUTES" ]; then
            if ! [[ "$ZAP_MAX_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::ZAP_MAX_MINUTES must be a positive integer, got '$ZAP_MAX_MINUTES'"
              exit 1
            fi
            # -m limits the spider; the scanner option limits the active scan
            spider_options="-m $ZAP_MAX_MINUTES"
            zap_config="$zap_config -config scanner.maxScanDurationInMins=$ZAP_MAX_MINUTES"
          fi
          echo "cmd_options=$spider_options -z \"$zap_config\"" >> "$GITHUB_OUTPUT"
          # zap-api-scan.py has no spider, so it only takes the -z options
          echo "api_cmd_options=-z \"$zap_config\"" >> "$GITHUB_OUTPUT"

      # Runs ZAP in Docker on the runner with --network=host, so the target is the published port.
      # The action uploads report_md.md, report_json.json and report_html.html as the zap-report artifact.
      - name: Run ZAP Full Scan (active and intrusive)
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
          cmd_options: ${{ steps.zap_options.outputs.cmd_options }}

      - name: Add ZAP full scan report to job summary
        if: ${{ !cancelled() && hashFiles('report_md.md') != '' }}
        run: bash scripts/zap-report-summary.sh "ZAP Full Scan" zap-report

      # Both actions write report_*.* to the workspace root, so clear the first scan's files
      - name: Clear full scan reports
        if: ${{ !cancelled() }}
        run: rm -f report_md.md report_json.json report_html.html

      # Covers the routes the crawl can't find, using the spec generated by rspec-openapi
      - name: Run ZAP API Scan
        if: ${{ !cancelled() }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: doc/openapi.yaml
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report
          cmd_options: ${{ steps.zap_options.outputs.api_cmd_options }}

      - name: Add ZAP API scan report to job summary
        if: ${{ !cancelled() && hashFiles('report_md.md') != '' }}
        run: bash scripts/zap-report-summary.sh "ZAP API Scan" zap-api-report
