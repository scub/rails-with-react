on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rails-with-react-testing-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: 00rawrus00/rails-with-react

name: Merge - Verify, Build, Attest and Release 

jobs:
  rails_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      
      - name: Run rubocop
        env:
          # config/database.yml requires DB_URL to boot Rails; rubocop never connects
          DB_URL: postgres://unused:unused@localhost:5432/unused
        run: bundle exec rake rubocop:markdown

  rails_audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      
      - name: Run bundle install
        run: |
          bundle config set --local frozen true
          bundle install

      - name: Run bundle audit
        run: |
          echo "Bundle audit results" >> $GITHUB_STEP_SUMMARY
          echo "====================" >> $GITHUB_STEP_SUMMARY
          bundle exec bundle-audit check --update >> $GITHUB_STEP_SUMMARY

      - name: Generate brakeman Report
        run: |
          bundle exec brakeman
          bundle exec brakeman -f markdown >> $GITHUB_STEP_SUMMARY

  rails_test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rails_react_monolith
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_react_monolith_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1

      - name: Run rspec unit tests
        env:
          DB_URL: postgres://rails_react_monolith:password@localhost:5432/rails_react_monolith_development
        run: bundle exec rake coverage:report
      
      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rails-coverage.html
          path: coverage/index.html
          overwrite: true

  frontend_lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Ensure packages installed
        run: npm ci

      - name: Run linter
        run: |
          status=0
          npx biome check --error-on-warnings --reporter=github --reporter=json --reporter-file=biome-report.json || status=$?
          node .github/scripts/biome/summary.mjs biome-report.json >> "$GITHUB_STEP_SUMMARY"
          exit $status

  frontend_audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Install depedencies
        run: npm ci

      - name: Run npm audit
        run: npm audit 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY
      

  frontend_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Ensure packages installed
        run: npm ci

      - name: Run vitest
        run: |
          npx vitest run --coverage
          cat vitest-report.md  >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        id: upload-report
        with:
          name: vitest-results.html
          path: vitest-results/index.html
          overwrite: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage.json
          path: coverage/coverage-final.json
          overwrite: true

      - name: Link HTML report
        run: echo "::notice title=Vitest HTML report::$REPORT_URL"
        env:
          REPORT_URL: https://viewer.vitest.dev/?url=${{ steps.upload-report.outputs.artifact-url }}

  docker_build:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tags.outputs.primary }}
      digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Compute image tags
        id: tags
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          primary="${GITHUB_RUN_NUMBER}-${HEAD_SHA::7}"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "tags=${{vars.IMAGE_NAME}}:${primary}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{vars.IMAGE_NAME}}:latest,${{vars.IMAGE_NAME}}:${{ steps.tags.outputs.build_tag }}
          attests: type=sbom,generator=docker/buildkit-syft-scanner:stable-1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker_scan:
    runs-on: ubuntu-latest
    needs: [docker_build]

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Generate SBOM
        uses: docker/scout-action@v1
        with:
          command: sbom
          format: cyclonedx
          image: ${{ vars.IMAGE_NAME }}@${{ needs.docker_build.outputs.digest }}
          output: rails-with-react-sbom.json

      - name: Generate CVE report
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ vars.IMAGE_NAME }}@${{ needs.docker_build.outputs.digest }}
          only-severities: critical,high
          output: rails-with-react-cves.json
          sarif-file: rails-with-react-cves.sarif
          only-fixed: true
          write-comment: true

      # Code scanning and attestations are only for what is published from main
      - name: Upload CVE results to code scanning
        if: ${{ hashFiles('rails-with-react-cves.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rails-with-react-cves.sarif
          category: docker-scout

      - name: Check sbom size
        run: du -sh rails-with-react-sbom.json

      # Max attestation size 16Mb
      - name: Publish attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ vars.IMAGE_NAME }}
          subject-digest: ${{ needs.docker_build.outputs.digest }}
          sbom-path: rails-with-react-sbom.json
          show-summary: true
        continue-on-error: true

  e2e_test:
    needs: docker_build
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rails_react_monolith
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_react_monolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rails_react_monolith -d rails_react_monolith_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      web:
        image: ${{ vars.IMAGE_NAME }}@${{ needs.docker_build.outputs.digest }}
        env:
          DB_URL: postgres://rails_react_monolith:password@postgres:5432/rails_react_monolith_test
          REDIS_URL: redis://redis:6379/0
          RAILS_ENV: test
        ports:
          - 3000:3000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache-dependency-path: 'package-lock.json'

      - name: Ensure packages installed
        run: npm ci

      - name: Install playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        env:
          BASE_URL: http://web:3000
        run: |
          npm run test:e2e
          cat playwright-report.md >> $GITHUB_STEP_SUMMARY

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run test:e2e:report

      - name: Archive Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          overwrite: true

  zap_scan:
    needs: docker_build
    runs-on: ubuntu-latest

    env:
      ZAP_MAX_MINUTES: ${{ inputs.zap_max_minutes || vars.ZAP_MAX_MINUTES }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rails_react_monolith
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rails_react_monolith_test
        options: >-
          --health-cmd "pg_isready -U rails_react_monolith -d rails_react_monolith_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      web:
        image: ${{vars.IMAGE_NAME}}:${{needs.docker_build.outputs.tag}}
        env:
          DB_URL: postgres://rails_react_monolith:password@postgres:5432/rails_react_monolith_test
          REDIS_URL: redis://redis:6379/0
          RAILS_ENV: test
        ports:
          - 3000:3000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Create ZAP test user
        run: bash .github/scripts/zap/create-test-user.sh

      - name: Configure ZAP options
        id: zap_options
        run: bash .github/scripts/zap/configure-options.sh

      - name: Run ZAP Full Scan (active and intrusive)
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
          cmd_options: ${{ steps.zap_options.outputs.cmd_options }}

      - name: Add ZAP full scan report to job summary
        if: ${{ !cancelled() && hashFiles('report_md.md') != '' }}
        run: bash .github/scripts/zap/report-summary.sh "ZAP Full Scan" zap-report

      - name: Clear full scan reports
        if: ${{ !cancelled() }}
        run: rm -f report_md.md report_json.json report_html.html

      - name: Run ZAP API Scan
        if: ${{ !cancelled() }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: doc/openapi.yaml
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report
          cmd_options: ${{ steps.zap_options.outputs.api_cmd_options }}

      - name: Add ZAP API scan report to job summary
        if: ${{ !cancelled() && hashFiles('report_md.md') != '' }}
        run: bash .github/scripts/zap/report-summary.sh "ZAP API Scan" zap-api-report
